}

.buehne{
  position:relative;z-index:1;
  height:100dvh;height:100svh;
  display:flex;flex-direction:column;
  padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto;
}

/* Kopfzeile */
.kopf{display:flex;align-items:center;gap:12px;min-height:34px;flex:0 0 auto}
.zurueck{
  background:none;border:none;color:var(--text-leise);
  font:inherit;font-size:14px;padding:6px 8px;margin-left:-8px;
  border-radius:8px;cursor:pointer;
}
.zurueck:hover{color:var(--text)}
.zurueck[hidden]{display:none}
.fortschritt{margin-left:auto;display:flex;gap:7px;align-items:center}
.punkt{width:6px;height:6px;border-radius:50%;background:rgba(201,180,122,.22);transition:background .4s}
.punkt.gelesen{background:var(--gold)}

/* Inhalt */
.inhalt{
  flex:1 1 auto;min-height:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:24px 2px;
  scrollbar-width:thin;scrollbar-color:rgba(201,180,122,.3) transparent;
}
/* Kurze Szenen stehen mittig, lange Szenen fangen oben an und scrollen sauber. */
.szene{min-height:100%;display:flex;flex-direction:column;justify-content:center}
.inhalt:focus-visible{outline:none}
/* Zeigt an, dass unten noch Text kommt. */
.inhalt.mehr{
  -webkit-mask-image:linear-gradient(180deg,#000 78%,rgba(0,0,0,.15) 100%);
  mask-image:linear-gradient(180deg,#000 78%,rgba(0,0,0,.15) 100%);
}
.mehrzeichen{
  flex:0 0 auto;text-align:center;font-size:13px;color:var(--text-leise);
  height:16px;opacity:0;transition:opacity .3s;pointer-events:none;
}
.mehrzeichen.an{opacity:.75}
.inhalt::-webkit-scrollbar{width:6px}
.inhalt::-webkit-scrollbar-thumb{background:rgba(201,180,122,.28);border-radius:3px}

.szene{animation:auf .55s ease both}
.szene > *{flex:0 0 auto}
@keyframes auf{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.kapitelzeile{
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gruen-gold);opacity:.8;margin:0 0 14px;
}
h1{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-weight:600;font-size:clamp(30px,8vw,42px);
  line-height:1.15;letter-spacing:.01em;margin:0 0 22px;color:#f0eadb;
}
h1::after{
  content:"";display:block;width:44px;height:1px;
  background:linear-gradient(90deg,var(--gold),rgba(201,180,122,0));
  margin-top:18px;
}
p{margin:0 0 18px;color:var(--text)}
p:last-child{margin-bottom:0}

.liste{margin:6px 0 20px;padding:18px 20px;border:1px solid var(--linie);border-radius:14px;background:rgba(18,48,57,.42)}
.liste h2{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;
  font-size:20px;margin:0 0 12px;color:var(--gold);letter-spacing:.01em;
}
.liste ul{margin:0;padding:0;list-style:none}
.liste li{position:relative;padding-left:20px;margin-bottom:9px;color:var(--text)}
.liste li:last-child{margin-bottom:0}
.liste li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:1px;background:var(--gruen-gold)}

figure{margin:6px 0 22px}
figure img{width:100%;display:block;border-radius:14px;border:1px solid var(--linie)}
.platzhalter{
  width:100%;aspect-ratio:4/3;border-radius:14px;
  border:1px dashed rgba(190,220,215,.2);
  background:linear-gradient(160deg,rgba(18,48,57,.7),rgba(9,30,36,.7));
  display:flex;align-items:center;justify-content:center;
  color:var(--text-leise);font-size:14px;text-align:center;padding:20px;
}
figcaption{margin-top:9px;font-size:13px;color:var(--text-leise)}

.frage{
  margin:8px 0 22px;padding:20px;border-left:2px solid var(--gold);
  background:rgba(18,48,57,.35);border-radius:0 12px 12px 0;
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:clamp(20px,5.4vw,25px);line-height:1.35;color:#f0eadb;
}

.antwortfeld{margin:6px 0 8px}
.antwortfeld label{display:block;font-size:14px;color:var(--gruen-gold);margin-bottom:9px}
textarea{
  width:100%;min-height:110px;resize:vertical;
  background:rgba(7,23,27,.6);color:var(--text);
  border:1px solid var(--linie);border-radius:12px;
  padding:13px 14px;font:inherit;font-size:16px;line-height:1.6;
}
textarea::placeholder{color:rgba(157,177,177,.55)}
textarea:hover{border-color:rgba(190,220,215,.24)}

.antwortkarte{margin-bottom:16px;padding:16px 18px;border:1px solid var(--linie);border-radius:14px;background:rgba(18,48,57,.35)}
.antwortkarte .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gruen-gold);margin-bottom:8px}
.antwortkarte .f{font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;color:#f0eadb;margin-bottom:8px;line-height:1.35}
.antwortkarte .a{white-space:pre-wrap;color:var(--text)}
.leer{color:var(--text-leise);font-style:italic}

/* Knöpfe */
.knoepfe{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;padding-top:16px}
.knopf{
  width:100%;font:inherit;font-size:16px;
  padding:15px 18px;border-radius:13px;cursor:pointer;
  background:rgba(201,180,122,.09);
  border:1px solid rgba(201,180,122,.42);
  color:#f0e6cd;text-align:left;
  transition:background .25s,border-color .25s,transform .12s;
}
.knopf:hover{background:rgba(201,180,122,.17);border-color:rgba(201,180,122,.7)}
.knopf:active{transform:translateY(1px)}
.knopf.still{background:transparent;border-color:var(--linie);color:var(--text-leise)}
.knopf.still:hover{color:var(--text);border-color:rgba(190,220,215,.28)}
.knopf.kopieren{text-align:center;font-size:15px}

:focus{outline:none}
:focus-visible{outline:2px solid var(--fokus);outline-offset:3px;border-radius:12px}

.hinweis{font-size:13px;color:var(--text-leise);text-align:center;min-height:18px;padding-top:4px}

@media (min-width:700px){
  body{font-size:18px}
  .buehne{padding:28px 24px 28px}
  .knoepfe{flex-direction:row;flex-wrap:wrap}
  .knopf{width:auto;flex:1 1 220px;text-align:center}
}

@media (prefers-reduced-motion:reduce){
  .szene{animation:none}
  .knopf{transition:none}
  #regen{opacity:.5}
}
</style>
</head>
<body>

<div id="grund"></div>
<canvas id="regen" aria-hidden="true"></canvas>
<div id="vignette"></div>

<main class="buehne">
  <div class="kopf">
    <button class="zurueck" id="zurueck" type="button" hidden>&larr; Zurück</button>
    <div class="fortschritt" id="fortschritt" aria-hidden="true"></div>
  </div>

  <div class="inhalt" id="inhalt" tabindex="-1"></div>

  <p class="mehrzeichen" id="mehrzeichen" aria-hidden="true">weiterlesen &darr;</p>

  <nav class="knoepfe" id="knoepfe" aria-label="Weiter"></nav>
  <p class="hinweis" id="hinweis"></p>
</main>

<script>
(function(){
  "use strict";

  var inhalt   = document.getElementById("inhalt");
  var knoepfe  = document.getElementById("knoepfe");
  var zurueck  = document.getElementById("zurueck");
  var fortschr = document.getElementById("fortschritt");
  var hinweis  = document.getElementById("hinweis");
  var mehrzchn = document.getElementById("mehrzeichen");

  var ANTWORTEN = {};          // nur im Arbeitsspeicher, bewusst nichts gespeichert
  var GELESEN   = {};          // welche Kapitel schon offen waren
  var VERLAUF   = [];          // für den Zurück-Knopf
  var aktuell   = null;

  var KAPITEL = ["k1_1","k2_1","k3_1","k4_1"];   // für die Punkte oben rechts

  function mehrPruefen(){
    var rest = inhalt.scrollHeight - inhalt.clientHeight - inhalt.scrollTop;
    var mehr = rest > 24;
    inhalt.classList.toggle("mehr", mehr);
    mehrzchn.classList.toggle("an", mehr);
  }

  function el(tag, klasse, text){
    var e = document.createElement(tag);
    if (klasse) e.className = klasse;
    if (text != null) e.textContent = text;
    return e;
  }

  function kapitelGruppe(id){
    if (id.indexOf("k1_") === 0) return "k1_1";
    if (id.indexOf("k2_") === 0) return "k2_1";
    if (id.indexOf("k3_") === 0) return "k3_1";
    if (id.indexOf("k4_") === 0) return "k4_1";
    return null;
  }

  function punkteBauen(){
    fortschr.innerHTML = "";
    KAPITEL.forEach(function(id){
      var p = el("span","punkt");
      p.dataset.fuer = id;
      fortschr.appendChild(p);
    });
  }

  function punkteAktualisieren(){
    Array.prototype.forEach.call(fortschr.children, function(p){
      p.classList.toggle("gelesen", !!GELESEN[p.dataset.fuer]);
    });
  }

  function antwortenSammeln(){
    var raus = [];
    Object.keys(SZENEN).forEach(function(id){
      var s = SZENEN[id];
      if (!s.antwort) return;
      raus.push({
        kapitel: s.kapitel || "",
        frage: s.frage || s.antwort.frage,
        text: (ANTWORTEN[id] || "").trim()
      });
    });
    return raus;
  }

  function zeige(id, alsZurueck){
    var s = SZENEN[id];
    if (!s){ console.warn("Szene fehlt: " + id); return; }

    if (aktuell && !alsZurueck && aktuell !== id) VERLAUF.push(aktuell);
    aktuell = id;

    var gruppe = kapitelGruppe(id);
    if (gruppe) GELESEN[gruppe] = true;
    punkteAktualisieren();

    zurueck.hidden = VERLAUF.length === 0;
    hinweis.textContent = "";

    var box = el("article","szene");

    if (s.kapitel) box.appendChild(el("p","kapitelzeile", s.kapitel));
    box.appendChild(el("h1", null, s.ueberschrift || ""));

    (s.absaetze || []).forEach(function(t){ box.appendChild(el("p", null, t)); });

    if (s.bild){
      var fig = el("figure");
      if (s.bild.quelle){
        var img = el("img");
        img.src = s.bild.quelle;
        img.alt = s.bild.alt || "";
        img.loading = "lazy";
        fig.appendChild(img);
      } else {
        fig.appendChild(el("div","platzhalter", s.bild.alt || "Platz für ein Bild"));
      }
      if (s.bild.text) fig.appendChild(el("figcaption", null, s.bild.text));
      box.appendChild(fig);
    }

    if (s.liste){
      var kasten = el("div","liste");
      if (s.liste.titel) kasten.appendChild(el("h2", null, s.liste.titel));
      var ul = el("ul");
      (s.liste.punkte || []).forEach(function(p){ ul.appendChild(el("li", null, p)); });
      kasten.appendChild(ul);
      box.appendChild(kasten);
    }

    if (s.frage) box.appendChild(el("p","frage", s.frage));

    if (s.antwort){
      var feld = el("div","antwortfeld");
      var lab  = el("label", null, s.antwort.frage || "Deine Antwort");
      var ta   = el("textarea");
      var taId = "antwort_" + id;
      lab.setAttribute("for", taId);
      ta.id = taId;
      ta.placeholder = s.antwort.platzhalter || "";
      ta.value = ANTWORTEN[id] || "";
      ta.addEventListener("input", function(){ ANTWORTEN[id] = ta.value; });
      feld.appendChild(lab); feld.appendChild(ta);
      box.appendChild(feld);
    }

    if (s.antwortenListe){
      var alle = antwortenSammeln();
      var etwas = false;
      alle.forEach(function(a){
        var k = el("div","antwortkarte");
        if (a.kapitel) k.appendChild(el("div","k", a.kapitel));
        k.appendChild(el("div","f", a.frage));
        if (a.text){ etwas = true; k.appendChild(el("div","a", a.text)); }
        else k.appendChild(el("div","a leer","(noch nichts geschrieben)"));
        box.appendChild(k);
      });
      if (etwas){
        var kop = el("button","knopf still kopieren","Alles kopieren");
        kop.type = "button";
        kop.addEventListener("click", function(){ kopiere(alle); });
        box.appendChild(kop);
      }
    }

    inhalt.innerHTML = "";
    inhalt.appendChild(box);
    inhalt.scrollTop = 0;

    knoepfe.innerHTML = "";
    (s.knoepfe || []).forEach(function(k){
      var b = el("button","knopf" + (k.still ? " still" : ""), k.text);
      b.type = "button";
      b.addEventListener("click", function(){ zeige(k.ziel); });
      knoepfe.appendChild(b);
    });

    regenZiel(typeof s.regen === "number" ? s.regen : 0.35);

    document.title = (s.ueberschrift ? s.ueberschrift + " · " : "") + "Für Pola";
    inhalt.focus({preventScroll:true});
    mehrPruefen();
    setTimeout(mehrPruefen, 400);
  }

  function kopiere(alle){
    var text = alle.filter(function(a){ return a.text; }).map(function(a){
      return (a.kapitel ? a.kapitel + " – " : "") + a.frage + "\n" + a.text;
    }).join("\n\n");
    if (!text) return;

    function ok(){ hinweis.textContent = "Kopiert. Du kannst es jetzt einfügen."; }
    function fehler(){ hinweis.textContent = "Hat nicht geklappt – bitte von Hand markieren."; }

    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok, fehler);
    } else {
      var t = document.createElement("textarea");
      t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select();
      try { document.execCommand("copy") ? ok() : fehler(); } catch(e){ fehler(); }
      document.body.removeChild(t);
    }
  }

  inhalt.addEventListener("scroll", mehrPruefen, {passive:true});
  window.addEventListener("resize", mehrPruefen);

  zurueck.addEventListener("click", function(){
    if (!VERLAUF.length) return;
    zeige(VERLAUF.pop(), true);
  });

  document.addEventListener("keydown", function(e){
    var tippt = document.activeElement && document.activeElement.tagName === "TEXTAREA";
    if (tippt) return;
    if (e.key === "ArrowLeft" && VERLAUF.length){ zeige(VERLAUF.pop(), true); }
  });

  /* ---------------------------------------------------------------- Regen -- */
  var leise = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv = document.getElementById("regen");
  var ctx = cv.getContext("2d");
  var b = 0, h = 0, dpr = 1;
  var tropfen = [];
  var MAX = 220;
  var staerke = 0.35, ziel = 0.35;

  function neuerTropfen(){
    return {
      x: Math.random(), y: Math.random(),
      laenge: 8 + Math.random()*22,
      tempo: 0.004 + Math.random()*0.010,
      alpha: 0.12 + Math.random()*0.35
    };
  }

  function messen(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    b = window.innerWidth; h = window.innerHeight;
    cv.width = Math.floor(b*dpr); cv.height = Math.floor(h*dpr);
    cv.style.width = b + "px"; cv.style.height = h + "px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function regenZiel(wert){
    ziel = Math.max(0, Math.min(1, wert));
    // Bei "prefers-reduced-motion" laeuft keine Animation:
    // der Regen steht still und wird nur einmal neu gezeichnet.
    if (leise){ staerke = ziel; zeichnen(); }
  }

  function zeichnen(){
    ctx.clearRect(0,0,b,h);
    staerke += (ziel - staerke) * 0.02;

    var anzahl = Math.round(MAX * staerke);
    for (var i = 0; i < anzahl; i++){
      var t = tropfen[i];
      var x = t.x * b, y = t.y * h;
      var l = t.laenge * (0.6 + staerke*0.7);
      ctx.strokeStyle = "rgba(198,224,224," + (t.alpha * (0.35 + staerke*0.65)).toFixed(3) + ")";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - l*0.16, y + l);
      ctx.stroke();

      if (!leise){
        t.y += t.tempo * (0.5 + staerke);
        t.x -= t.tempo * 0.08;
        if (t.y > 1.05){ t.y = -0.05; t.x = Math.random(); }
        if (t.x < -0.05) t.x = 1.05;
      }
    }
    if (!leise) requestAnimationFrame(zeichnen);
  }

  for (var i = 0; i < MAX; i++) tropfen.push(neuerTropfen());
  messen();
  window.addEventListener("resize", function(){ messen(); if (leise) zeichnen(); });
  requestAnimationFrame(zeichnen);

  /* ---------------------------------------------------------------- Start -- */
  punkteBauen();
  zeige(START_SZENE);
})();
</script>
</body>
</html>
